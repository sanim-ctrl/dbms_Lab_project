# render.yaml -- optional Render Blueprint for the Blood Bank Management System.
#
# Using this file is OPTIONAL. You can instead create the Web Service manually
# in the Render dashboard and paste the same values. No secret values live here:
# anything marked `sync: false` is asked for (once) in the Render UI, and
# FLASK_SECRET_KEY is generated by Render.
#
# The Aiven CA certificate must be added as a Render "Secret File" named
# `aiven-ca.pem` (Render mounts secret files at /etc/secrets/<name>).
services:
  - type: web
    name: blood-bank-management-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60 app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # --- Aiven MySQL connection (fill these in the Render dashboard) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Must match the database that schema.sql/seed.sql were imported into.
      - key: DB_NAME
        value: "blood_bank_db"
      # Path to the mounted Aiven CA certificate (enables verified TLS).
      - key: DB_SSL_CA
        value: "/etc/secrets/aiven-ca.pem"
      # --- Flask ---
      - key: FLASK_SECRET_KEY
        generateValue: true
      # --- Admin approval workflow (see README §22) ---
      # SECRET_KEY signs admin sessions; ADMIN_PASSWORD_HASH is set in the
      # dashboard (never in this file). ADMIN_PASSWORD is an optional fallback.
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: LOW_STOCK_THRESHOLD
        value: "10"
