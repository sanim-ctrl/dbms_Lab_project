{% extends "base.html" %}
{% block title %}{{ 'Edit Hospital' if hospital_id else 'Add Hospital' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit Hospital' if hospital_id else 'Add Hospital' }}</h1>

<form class="form" method="post"
      action="{{ url_for('hospital_edit', hospital_id=hospital_id) if hospital_id else url_for('hospital_new') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label>Name
    <input type="text" name="name" value="{{ hospital.Name if hospital else '' }}" maxlength="150" required>
  </label>

  <label>Address
    <input type="text" name="address" value="{{ hospital.Address if hospital and hospital.Address else '' }}" maxlength="255">
  </label>

  <label>Phone
    <input type="text" name="phone" value="{{ hospital.Phone if hospital else '' }}" maxlength="15" required>
  </label>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save Hospital</button>
    <a class="btn btn-secondary" href="{{ url_for('hospitals_list') }}">Cancel</a>
  </div>
</form>
{% endblock %}
